  } catch (e) {}

<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:22px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sidebar-w:288px;

  --bg:#09090c;
  --aura-1:rgba(124,108,255,.16);--aura-2:rgba(56,189,248,.10);
  --surface:rgba(20,20,26,.72);--surface-solid:#131318;--surface-2:#1a1a21;--surface-3:#23232c;
  --hover:rgba(255,255,255,.06);--press:rgba(255,255,255,.1);
  --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.15);
  --text:#ededf2;--text-2:#a4a4b4;--text-3:#70707f;
  --accent:#8b7dff;--accent-strong:#a397ff;--accent-soft:rgba(139,125,255,.16);--on-accent:#0c0b16;
  --success:#4ade9b;--danger:#ff6b81;--danger-soft:rgba(255,107,129,.14);--warning:#f6c35b;
  --shadow:0 20px 60px rgba(0,0,0,.55);--shadow-sm:0 4px 16px rgba(0,0,0,.35);
  --scrim:rgba(4,4,8,.66);
  --k-folder:#a397ff;--k-image:#38bdf8;--k-video:#c084fc;--k-audio:#f472b6;--k-pdf:#fb7185;--k-code:#fbbf24;--k-doc:#60a5fa;--k-sheet:#34d399;--k-slides:#fb923c;--k-pad:#4ade9b;--k-other:#94a3b8;
}
:root[data-theme="light"]{
  --bg:#f3f4f8;--aura-1:rgba(91,77,255,.10);--aura-2:rgba(14,165,233,.08);
  --surface:rgba(255,255,255,.8);--surface-solid:#fff;--surface-2:#f6f6fa;--surface-3:#ececf3;
  --hover:rgba(18,18,40,.05);--press:rgba(18,18,40,.09);
  --border:rgba(18,18,40,.09);--border-strong:rgba(18,18,40,.17);
  --text:#15151d;--text-2:#555869;--text-3:#878a9c;
  --accent:#5b4dff;--accent-strong:#4a3cf0;--accent-soft:rgba(91,77,255,.1);--on-accent:#fff;
  --success:#0e9f6e;--danger:#e11d48;--danger-soft:rgba(225,29,72,.08);--warning:#b7791f;
  --shadow:0 20px 60px rgba(20,20,50,.16);--shadow-sm:0 4px 16px rgba(20,20,50,.08);--scrim:rgba(20,20,40,.35);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f4f8;--aura-1:rgba(91,77,255,.10);--aura-2:rgba(14,165,233,.08);
  --surface:rgba(255,255,255,.8);--surface-solid:#fff;--surface-2:#f6f6fa;--surface-3:#ececf3;
  --hover:rgba(18,18,40,.05);--press:rgba(18,18,40,.09);
  --border:rgba(18,18,40,.09);--border-strong:rgba(18,18,40,.17);
  --text:#15151d;--text-2:#555869;--text-3:#878a9c;
  --accent:#5b4dff;--accent-strong:#4a3cf0;--accent-soft:rgba(91,77,255,.1);--on-accent:#fff;
  --success:#0e9f6e;--danger:#e11d48;--danger-soft:rgba(225,29,72,.08);--warning:#b7791f;
  --shadow:0 20px 60px rgba(20,20,50,.16);--shadow-sm:0 4px 16px rgba(20,20,50,.08);--scrim:rgba(20,20,40,.35);
}}

/* ============ BASE ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.45 var(--font);color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 600px at 0% 0%,var(--aura-1),transparent 60%),radial-gradient(800px 600px at 100% 100%,var(--aura-2),transparent 60%);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:var(--accent-strong)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:15px;height:15px}.ic-lg{width:22px;height:22px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.kbd{font:500 11px var(--mono);padding:2px 6px;border-radius:6px;border:1px solid var(--border-strong);color:var(--text-2);background:var(--surface-2)}
.muted{color:var(--text-2)}.tiny{font-size:12px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ CONTROLS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);font-weight:500;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--surface-3);border-color:var(--border-strong)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600}
.btn-primary:hover:not(:disabled){background:var(--accent-strong);border-color:transparent}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:var(--danger-soft)}
.btn-danger:hover:not(:disabled){background:color-mix(in srgb,var(--danger) 22%,transparent)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover:not(:disabled){background:var(--hover);border-color:transparent}
.btn-sm{height:30px;padding:0 10px;font-size:12px;border-radius:9px}
.btn-block{width:100%}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;color:var(--text-2);transition:background .15s,color .15s;flex:none}
.icon-btn:hover:not(:disabled){background:var(--hover);color:var(--text)}
.icon-btn.on{color:var(--accent-strong);background:var(--accent-soft)}
.input,.select,textarea.input{width:100%;height:38px;padding:0 12px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);outline:0;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:120px;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.select{appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:transparent;font-size:12px;font-weight:500;color:var(--text-2);transition:.15s}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-strong);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border)}
.seg button{height:28px;min-width:30px;padding:0 8px;border-radius:8px;color:var(--text-2);display:grid;place-items:center}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);box-shadow:var(--shadow-sm)}
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:600;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.badge.warn{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning);font-variant-numeric:tabular-nums}
.badge.ok{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--surface-3);border:1px solid var(--border-strong);transition:.2s}
.switch span::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-2);transition:.2s var(--ease)}
.switch input:checked+span{background:var(--accent);border-color:transparent}
.switch input:checked+span::after{transform:translateX(16px);background:#fff}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* file kind icon */
.ficon{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;flex:none;color:var(--k,var(--k-other));background:color-mix(in srgb,var(--k,var(--k-other)) 14%,transparent)}
.ficon .ic{width:16px;height:16px}
[data-kind=folder]{--k:var(--k-folder)}[data-kind=image]{--k:var(--k-image)}[data-kind=video]{--k:var(--k-video)}[data-kind=audio]{--k:var(--k-audio)}[data-kind=pdf]{--k:var(--k-pdf)}[data-kind=code],[data-kind=html],[data-kind=markdown],[data-kind=text]{--k:var(--k-code)}[data-kind=doc]{--k:var(--k-doc)}[data-kind=sheet]{--k:var(--k-sheet)}[data-kind=slides]{--k:var(--k-slides)}[data-kind=pad]{--k:var(--k-pad)}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;height:100dvh}
.sidebar{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.brand img{width:30px;height:30px;border-radius:9px;object-fit:cover;background:var(--surface-3)}
.brand b{font-size:15px;font-weight:650;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--text-3)}
.side-search{position:relative;margin:4px 12px 8px}
.side-search .ic{position:absolute;left:11px;top:10px;color:var(--text-3)}
.side-search .input{padding-left:34px;padding-right:58px}
.side-search .kbd{position:absolute;right:9px;top:9px}
.side-search .clear{position:absolute;right:6px;top:3px}
.side-scroll{flex:1;overflow:auto;padding:4px 8px 12px;min-height:0}
.side-label{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.row{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:3px 8px;padding-left:calc(8px + var(--depth,0) * 14px);border-radius:9px;color:var(--text-2);text-align:left;font-size:13px;transition:background .12s,color .12s;position:relative}
.row:hover{background:var(--hover);color:var(--text)}
.row.active{background:var(--accent-soft);color:var(--text)}
.row.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ficon{width:24px;height:24px;border-radius:7px}
.row .ficon .ic{width:14px;height:14px}
.row .chev{width:14px;height:14px;color:var(--text-3);transition:transform .15s var(--ease)}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.row .spacer{width:14px;flex:none}
.row .meta{font-size:11px;color:var(--text-3)}
.row .star{color:var(--warning);width:13px;height:13px;fill:currentColor}
.row mark{background:var(--accent-soft);color:var(--accent-strong);border-radius:3px}
.result-path{display:block;font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-footer{padding:12px;border-top:1px solid var(--border);display:grid;gap:8px}
.side-footer .tools{display:flex;align-items:center;gap:2px}
.side-footer .tools .grow{flex:1}
.admin-pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:99px;background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success);font-size:11px;font-weight:600}
.empty-mini{padding:10px;font-size:12px;color:var(--text-3)}
.skel{height:30px;margin:4px 0;border-radius:9px;background:linear-gradient(90deg,var(--hover),var(--press),var(--hover));background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{to{background-position:-200% 0}}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:6px;height:52px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--surface);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.menu-btn{display:none}
.tabs{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;height:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;height:34px;max-width:220px;padding:0 6px 0 10px;border-radius:10px;font-size:13px;color:var(--text-2);flex:none;border:1px solid transparent}
.tab:hover{background:var(--hover);color:var(--text)}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.tab .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;color:var(--text-3)}
.tab .x:hover{background:var(--press);color:var(--text)}
.tab .dirty{width:7px;height:7px;border-radius:50%;background:var(--warning);flex:none}
.tab.hometab{padding:0 12px}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3);padding:0 6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 20%,transparent)}
.dot.busy{background:var(--accent);animation:pulse 1s infinite}
.dot.err{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
@keyframes pulse{50%{opacity:.35}}
.palette-btn{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);font-size:12px}
.palette-btn:hover{color:var(--text);border-color:var(--border-strong)}
.view{flex:1;min-height:0;overflow:auto}
.scrim{display:none}

/* ============ HOME ============ */
.home{max-width:1240px;margin:0 auto;padding:28px 28px 60px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.hero p{margin-top:6px;color:var(--text-2)}
.hero .actions{display:flex;gap:8px;flex-wrap:wrap}
.section{margin-top:26px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-head h2{font-size:14px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--surface);text-align:left;min-width:0;transition:border-color .15s,transform .15s,background .15s}
.card:hover{border-color:var(--border-strong);background:var(--surface-2);transform:translateY(-1px)}
.card .ficon{width:36px;height:36px;border-radius:10px}
.card .t{min-width:0;flex:1}
.card .t b{display:block;font-weight:550;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .t span{font-size:11px;color:var(--text-3)}
.browser-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);margin-bottom:12px}
.crumbs{display:flex;align-items:center;gap:2px;flex:1;min-width:160px;flex-wrap:wrap}
.crumbs button{height:28px;padding:0 8px;border-radius:8px;font-weight:550;color:var(--text-2);font-size:13px}
.crumbs button:hover{background:var(--hover);color:var(--text)}
.crumbs button:last-child{color:var(--text)}
.crumbs .ic{width:14px;height:14px;color:var(--text-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--surface);overflow:hidden;text-align:left;transition:border-color .15s,transform .15s,box-shadow .15s}
.tile:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.tile .thumb{aspect-ratio:4/3;display:grid;place-items:center;background:color-mix(in srgb,var(--k,var(--k-other)) 9%,var(--surface-2));overflow:hidden}
.tile .thumb img{width:100%;height:100%;object-fit:cover}
.tile .thumb .ficon{width:52px;height:52px;border-radius:14px;background:transparent}
.tile .thumb .ficon .ic{width:30px;height:30px;stroke-width:1.5}
.tile .info{padding:10px 12px 12px}
.tile .info b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:550;font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.tile .info span{display:block;margin-top:4px;font-size:11px;color:var(--text-3)}
.tile .tags{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}
.tile .more{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-solid);border:1px solid var(--border);opacity:0;transition:opacity .15s;color:var(--text-2)}
.tile:hover .more,.tile:focus-within .more{opacity:1}
.list{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 90px 40px;align-items:center;gap:10px;width:100%;padding:8px 12px;border-top:1px solid var(--border);text-align:left;font-size:13px}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--hover)}
.lrow .n{display:flex;align-items:center;gap:10px;min-width:0}
.lrow .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .c{color:var(--text-3);font-size:12px}
.lrow.head{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);background:var(--surface-2)}
.lrow.head:hover{background:var(--surface-2)}
.empty{display:grid;place-items:center;gap:10px;padding:56px 20px;text-align:center;color:var(--text-2);border:1px dashed var(--border-strong);border-radius:var(--r-lg)}
.empty .ic{width:34px;height:34px;color:var(--text-3)}
.empty b{color:var(--text);font-size:15px}

/* ============ VIEWER ============ */
.fileview{display:flex;flex-direction:column;height:100%}
.vbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface);min-height:52px;flex-wrap:wrap}
.vtitle{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.vtitle .t{min-width:0}
.vtitle b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtitle span{display:block;font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vactions{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.vsep{width:1px;height:22px;background:var(--border);margin:0 4px}
.zoomgrp{display:flex;align-items:center;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.zoomgrp .icon-btn{width:32px;height:32px}
.zoomgrp span{min-width:44px;text-align:center;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.vbody{flex:1;min-height:0;position:relative;overflow:auto;background:var(--surface-solid)}
.vbody.dark-stage{background:#050507}
.zoomlayer{transform-origin:0 0;width:100%;height:100%}
.vbody iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.imgstage{min-height:100%;display:grid;place-items:center;padding:24px;background-image:linear-gradient(45deg,var(--hover) 25%,transparent 25%,transparent 75%,var(--hover) 75%),linear-gradient(45deg,var(--hover) 25%,transparent 25%,transparent 75%,var(--hover) 75%);background-size:24px 24px;background-position:0 0,12px 12px}
.imgstage img{max-width:100%;max-height:calc(100dvh - 160px);border-radius:8px;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.mediastage{min-height:100%;display:grid;place-items:center;padding:24px}
.mediacard{width:min(900px,100%);display:grid;gap:14px}
.mediacard video,.mediacard audio{width:100%;border-radius:14px;background:#000}
.speed{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.prose{max-width:820px;margin:0 auto;padding:40px 32px 80px;font-size:15px;line-height:1.7}
.prose h1,.prose h2,.prose h3{line-height:1.25;margin:1.6em 0 .6em;letter-spacing:-.015em}
.prose h1{font-size:2em}.prose h2{font-size:1.5em;padding-bottom:.3em;border-bottom:1px solid var(--border)}.prose h3{font-size:1.2em}
.prose p,.prose ul,.prose ol,.prose pre,.prose blockquote,.prose table{margin:0 0 1em}
.prose ul,.prose ol{padding-left:1.5em}
.prose code{font:.88em var(--mono);padding:.15em .4em;border-radius:6px;background:var(--surface-3)}
.prose pre{padding:14px 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);overflow:auto}
.prose pre code{padding:0;background:none}
.prose blockquote{padding-left:14px;border-left:3px solid var(--accent);color:var(--text-2)}
.prose img{max-width:100%;border-radius:10px}
.prose table{border-collapse:collapse;display:block;overflow:auto}
.prose th,.prose td{padding:6px 12px;border:1px solid var(--border)}
.code-wrap{font:13px/1.65 var(--mono);padding:16px 0;min-height:100%}
.code-wrap pre{margin:0;counter-reset:ln;tab-size:2}
.code-wrap .ln{display:block;padding:0 20px 0 64px;position:relative;white-space:pre}
.code-wrap.wrap .ln{white-space:pre-wrap;overflow-wrap:anywhere}
.code-wrap .ln::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:48px;text-align:right;color:var(--text-3);user-select:none}
.token.comment,.token.prolog,.token.doctype,.token.cdata{color:var(--text-3);font-style:italic}
.token.punctuation{color:var(--text-2)}
.token.property,.token.tag,.token.boolean,.token.number,.token.constant,.token.symbol,.token.deleted{color:#f472b6}
.token.selector,.token.attr-name,.token.string,.token.char,.token.builtin,.token.inserted{color:#4ade9b}
.token.operator,.token.entity,.token.url{color:#38bdf8}
.token.atrule,.token.attr-value,.token.keyword{color:var(--accent-strong)}
.token.function,.token.class-name{color:#fbbf24}
.token.regex,.token.important,.token.variable{color:#fb923c}
:root[data-theme="light"] .token.string,:root[data-theme="light"] .token.attr-name{color:#047857}
:root[data-theme="light"] .token.function{color:#b45309}
.editor{display:flex;flex-direction:column;height:100%}
.editor textarea{flex:1;width:100%;border:0;outline:0;resize:none;padding:22px 26px;background:transparent;font:14px/1.7 var(--mono);tab-size:2}
.editor-foot{display:flex;align-items:center;gap:12px;padding:6px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);background:var(--surface)}
.editor-foot .grow{flex:1}
.lockscreen{height:100%;display:grid;place-items:center;padding:24px}
.lockcard{width:min(380px,100%);display:grid;gap:12px;text-align:center;padding:28px;border-radius:var(--r-xl);border:1px solid var(--border);background:var(--surface)}
.lockcard .ic{width:36px;height:36px;margin:0 auto;color:var(--accent)}
.loading{height:100%;display:grid;place-items:center;color:var(--text-3)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--border-strong);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ OVERLAYS ============ */
.modal-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .18s}
.modal-backdrop.open{opacity:1}
.modal-backdrop.top{align-items:start;padding-top:12vh}
.modal-card{width:min(460px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:22px;border-radius:var(--r-xl);border:1px solid var(--border-strong);background:var(--surface-solid);box-shadow:var(--shadow);transform:translateY(8px) scale(.985);transition:transform .2s var(--ease)}
.modal-backdrop.open .modal-card{transform:none}
.modal-card.wide{width:min(640px,100%)}
.modal-card.xl{width:min(1100px,100%);height:min(820px,calc(100dvh - 32px));padding:0;display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.modal-title{font-size:17px;font-weight:650;letter-spacing:-.01em}
.modal-copy{color:var(--text-2);font-size:13px;margin-bottom:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.field{display:grid;gap:6px;margin-top:12px}
.field>label,.field>.lbl{font-size:12px;font-weight:550;color:var(--text-2)}
.field .hint{font-size:11px;color:var(--text-3)}
.form-error{min-height:18px;margin-top:10px;font-size:12px;color:var(--danger)}
.check{display:flex;align-items:center;gap:10px;font-size:13px}
.menu{position:fixed;z-index:200;min-width:200px;padding:6px;border-radius:14px;border:1px solid var(--border-strong);background:var(--surface-solid);box-shadow:var(--shadow)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:9px;font-size:13px;text-align:left;color:var(--text)}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:0}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--border);margin:5px 4px}
.menu .ic{color:var(--text-2)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:grid;gap:8px;justify-items:end;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;max-width:min(420px,calc(100vw - 32px));padding:11px 12px 11px 14px;border-radius:14px;border:1px solid var(--border-strong);background:var(--surface-solid);box-shadow:var(--shadow);font-size:13px;pointer-events:auto;animation:tin .22s var(--ease)}
.toast .ic{color:var(--accent)}
.toast.success .ic{color:var(--success)}.toast.error .ic{color:var(--danger)}
.toast button{font-weight:600;color:var(--accent-strong);padding:4px 6px;border-radius:6px}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:90;width:min(360px,100vw);padding:20px;overflow:auto;background:var(--surface-solid);border-left:1px solid var(--border-strong);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .25s var(--ease)}
.drawer.open{transform:none}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px 12px;font-size:13px;margin-top:16px}
.kv dt{color:var(--text-3)}.kv dd{overflow-wrap:anywhere}
.dropzone{display:grid;place-items:center;gap:8px;padding:26px 16px;border:1.5px dashed var(--border-strong);border-radius:var(--r-lg);text-align:center;color:var(--text-2);cursor:pointer;transition:.15s}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.dropzone .ic{width:28px;height:28px;color:var(--accent)}
.queue{display:grid;gap:4px;max-height:180px;overflow:auto;margin-top:10px}
.qrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:9px;background:var(--surface-2);font-size:12px}
.qrow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folderpick{max-height:170px;overflow:auto;border:1px solid var(--border);border-radius:var(--r-md);padding:4px;margin-top:6px}
.folderpick button{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:4px 8px;border-radius:8px;font-size:12px;text-align:left;color:var(--text-2)}
.folderpick button:hover{background:var(--hover);color:var(--text)}
.folderpick button[aria-pressed="true"]{background:var(--accent-soft);color:var(--text)}
.expiry{padding:12px;border:1px solid var(--border);border-radius:var(--r-md);margin-top:12px;display:grid;gap:10px}
.expiry .opts{display:grid;gap:8px;font-size:13px}
.expiry .opts label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.expiry input[type=number]{width:90px}
.expiry input[type=datetime-local]{width:auto}
.tray{position:fixed;left:16px;bottom:16px;z-index:250;width:min(360px,calc(100vw - 32px));border-radius:var(--r-lg);border:1px solid var(--border-strong);background:var(--surface-solid);box-shadow:var(--shadow);overflow:hidden}
.tray-head{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px;font-size:13px;font-weight:600}
.tray-head .grow{flex:1}
.bar{height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.bar.indet i{width:35%;animation:indet 1.1s infinite ease-in-out}
@keyframes indet{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.tray-list{max-height:220px;overflow:auto;padding:0 14px 12px;display:grid;gap:10px}
.titem{font-size:12px;display:grid;gap:5px}
.titem .r{display:flex;gap:8px;align-items:center}
.titem .r .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titem.done .bar i{background:var(--success);width:100%}
.titem.fail{color:var(--danger)}
.dropall{position:fixed;inset:0;z-index:400;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);pointer-events:none;opacity:0;transition:opacity .15s}
.dropall.show{opacity:1}
.dropall div{padding:40px 56px;border:2px dashed var(--accent);border-radius:28px;background:var(--surface-solid);text-align:center;box-shadow:var(--shadow)}
.dropall .ic{width:40px;height:40px;color:var(--accent);margin-bottom:8px}
.palette{width:min(620px,100%);padding:0;overflow:hidden}
.palette .pin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.palette .pin input{flex:1;border:0;outline:0;background:transparent;font-size:16px}
.palette .plist{max-height:min(420px,60dvh);overflow:auto;padding:6px}
.palette .pgroup{padding:8px 10px 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
.palette .pitem{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:6px 10px;border-radius:10px;text-align:left}
.palette .pitem[aria-selected="true"]{background:var(--accent-soft)}
.palette .pitem .t{flex:1;min-width:0}
.palette .pitem b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palette .pitem span{display:block;font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palette .pfoot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3)}
.shortcuts{display:grid;grid-template-columns:1fr auto;gap:10px 18px;font-size:13px;margin-top:10px}
.debug{position:fixed;left:16px;bottom:16px;z-index:500;width:min(520px,calc(100vw - 32px));max-height:260px;overflow:auto;padding:12px;border-radius:12px;background:#07070b;color:#cbd5e1;border:1px solid var(--border-strong);font:11px/1.5 var(--mono);white-space:pre-wrap}

/* ============ ADMIN ============ */
.adm{display:grid;grid-template-columns:210px 1fr;flex:1;min-height:0}
.adm-nav{padding:14px 10px;border-right:1px solid var(--border);display:grid;align-content:start;gap:2px;background:var(--surface-2)}
.adm-nav .row{padding-left:10px}
.adm-main{min-height:0;overflow:auto;padding:20px 22px 30px}
.adm-head{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--border)}
.adm-head h2{font-size:16px;font-weight:650;flex:1}
.adm-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.adm-toolbar .input,.adm-toolbar .select{height:34px;width:auto}
.adm-toolbar .input{flex:1;min-width:180px}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;margin-bottom:10px;border-radius:12px;background:var(--accent-soft);font-size:13px}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:6px}
.arow .t{min-width:0}
.arow .t b{display:block;font-weight:550;overflow-wrap:anywhere}
.arow .t span{display:block;font-size:11px;color:var(--text-3);overflow-wrap:anywhere}
.arow .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.arow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.arow details{grid-column:1/-1;font-size:12px;color:var(--text-2)}
.arow summary{cursor:pointer;color:var(--text-3)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:18px}
.stat{padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--surface)}
.stat span{font-size:12px;color:var(--text-3)}
.stat b{display:block;font-size:20px;margin-top:4px;letter-spacing:-.01em}
.panel{padding:16px;border-radius:14px;border:1px solid var(--border);background:var(--surface);margin-bottom:12px}
.panel h3{font-size:14px;margin-bottom:4px}
.panel p{font-size:13px;color:var(--text-2);margin-bottom:12px}

/* ============ RESPONSIVE ============ */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);transform:translateX(-100%);transition:transform .25s var(--ease);background:var(--surface-solid)}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .scrim{display:block;position:fixed;inset:0;z-index:25;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .menu-btn{display:inline-grid}
  .status .txt,.palette-btn .lbl,.palette-btn .kbd{display:none}
  .home{padding:20px 16px 60px}
  .hero h1{font-size:24px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .lrow{grid-template-columns:minmax(0,1fr) 70px 40px}
  .lrow .c.d{display:none}
  .adm{grid-template-columns:1fr}
  .adm-nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border);padding:8px}
  .adm-nav .row{width:auto;flex:none}
  .adm-main{padding:14px}
  .arow{grid-template-columns:auto minmax(0,1fr)}
  .arow .acts{grid-column:1/-1;justify-content:flex-start}
  .vbar .hide-sm{display:none}
  .icon-btn{width:40px;height:40px}
}
</style>
</head>

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }

const fmt = {
  size(n) {
    n = Number(n);
    if (!isFinite(n) || n <= 0) return '—';
    const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }

  datetime(v) { const d = new Date(v); return isNaN(d) ? '—' : d.toLocaleString(); },

/* debug log (Ctrl+Shift+D) */
const logs = [];
function debug(msg, err) {
  const line = `${new Date().toLocaleTimeString()}  ${msg}${err ? '\n  ' + (err.stack || err.message || err) : ''}`;
  logs.unshift(line); logs.length = Math.min(logs.length, 80);

/* =====================================================================
   TOASTS · MODALS · DIALOGS · MENUS
   ===================================================================== */
function toast(message, type = 'info', opts = {}) {

  if (opts.action) t.append(h('button', {type: 'button', text: opts.action.label, onclick: () => { t.remove(); opts.action.run(); }}));
  t.append(h('button', {type: 'button', 'aria-label': 'Dismiss', onclick: () => t.remove()}, icon('x', 'ic-sm')));

const modals = [];
function openModal(card, {onClose, top = false} = {}) {
  const back = h('div', {class: 'modal-backdrop' + (top ? ' top' : '')}, card);

});

/** Generic dialog. fields: [{name,label,type,value,placeholder,hint,options,required}] → values object, true (no fields) or null. */
function dialog({title, message, fields = [], confirmText = 'OK', cancelText = 'Cancel', danger = false, validate}) {
  return new Promise(resolve => {
    const idT = 'dlg' + Math.random().toString(36).slice(2);
    const controls = {};

      let c;
      if (f.type === 'textarea') c = h('textarea', {class: 'input', name: f.name, placeholder: f.placeholder || '', value: f.value || ''});

    });

    const cancel = h('button', {class: 'btn', type: 'button', text: cancelText});

    form.append(err, h('div', {class: 'modal-actions'}, cancel, ok));

let openMenuEl = null;

/* =====================================================================

   ===================================================================== */
class ApiError extends Error { constructor(msg, code, data) { super(msg); this.code = code; this.data = data || {}; } }

async function fetchJson(url, opts = {}, timeout = 60000) {

   ===================================================================== */
const EXT = {

    el.textContent = fmt.left(at);

document.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const typing = /INPUT|TEXTAREA|SELECT/.test(tag) || (document.activeElement && document.activeElement.isContentEditable);
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape') {
    if (openMenuEl) return closeMenu();
    if (modals.length) return modals[modals.length - 1].close();
    if (drawerEl) return closeInfo();
    if ($('#sidebar').classList.contains('open')) return closeSidebar();
    if (state.query) { state.query = ''; $('#side-search').value = ''; renderSidebar(); }
    return;
  }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); return openPalette(); }
  if (mod && e.key.toLowerCase() === 's') { const t = activeTab(); if (t && isEditable(t)) { e.preventDefault(); saveTab(t); } return; }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'a') { e.preventDefault(); return openAdmin(); }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'd') {
    e.preventDefault();
    const p = $('#debug'); if (p) return p.remove();
    return document.body.append(h('div', {class: 'debug', id: 'debug', text: logs.join('\n') || 'No log entries yet.'}));
  }
  if (e.altKey && e.key.toLowerCase() === 'w') { e.preventDefault(); if (state.active !== 'home') closeTab(state.active); return; }
  if (e.altKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    e.preventDefault();
    const keys = ['home', ...state.tabs.map(t => t.key)], i = keys.indexOf(state.active);
    return activate(keys[(i + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length]);
  }
  if (typing || mod || e.altKey || modals.length) return;
  const k = e.key.toLowerCase();
  if (k === '/') { e.preventDefault(); openSidebar(); $('#side-search').focus(); }
  else if (k === '?' || e.key === 'F1') { e.preventDefault(); openShortcuts(); }
  else if (k === 'u') openUpload();
  else if (k === 'h') activate('home');
  else if (k === 'r') refresh();
  else if (k === 't') toggleTheme();
  else if (k === 'f') toggleFullscreen();
  else if ((k === 'arrowdown' || k === 'arrowup') && document.activeElement && document.activeElement.closest('.side-scroll')) {
    e.preventDefault();
    const rows = [...document.querySelectorAll('.side-scroll .row')].filter(r => r.offsetParent !== null);
    const i = rows.indexOf(document.activeElement);
    const next = rows[k === 'arrowdown' ? Math.min(rows.length - 1, i + 1) : Math.max(0, i - 1)]; if (next) next.focus();
  } else if ((k === 'arrowright' || k === 'arrowleft') && document.activeElement && document.activeElement.dataset.folder) {

  }
});

$('#side-search').addEventListener('input', debounce(e => { state.query = e.target.value; renderSidebar(); }, 120));
$('#side-search').addEventListener('keydown', e => { if (e.key === 'Enter') { const first = $('#side-results .row'); if (first) first.click(); } });
$('#side-clear').onclick = () => { $('#side-search').value = ''; state.query = ''; renderSidebar(); $('#side-search').focus(); };
$('#nav-home').onclick = () => { browseTo(null); closeSidebar(); };
$('#collapse-all').onclick = () => { state.expanded.clear(); store.set('dw_expanded', []); renderTree(); };
$('#upload-btn').onclick = () => { closeSidebar(); openUpload(); };
$('#theme-btn').onclick = toggleTheme;
$('#keys-btn').onclick = openShortcuts;
$('#admin-btn').onclick = () => { closeSidebar(); openAdmin(); };
$('#menu-btn').onclick = openSidebar;
$('#scrim').onclick = closeSidebar;
$('#refresh-btn').onclick = () => refresh();
$('#palette-btn').onclick = openPalette;
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => setTheme(document.documentElement.dataset.theme || null));

admin.load(); admin.touch(); renderAdminPill(); setTheme(document.documentElement.dataset.theme || null);
const cached = store.get('dw_bootstrap_v2', null);
if (cached) { try { applyData(cached, true); } catch (err) { debug('Bad cached data', err); } }
renderAll();
refresh({silent: !!cached});
setInterval(tickCountdowns, 1000);
setInterval(renderStatus, 30000);
setInterval(pollVersion, CONFIG.POLL_MS);
document.addEventListener('visibilitychange', pollVersion);
})();
</script>
</body>
</html>
